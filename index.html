<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Recipe Lab — lecture balance</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="top-row">
          <h1>Lecture balance</h1>
          <p class="dataset-count compact">Ex. <strong id="dataset-count">0</strong></p>
        </div>
        <p class="hint">Cadrez les chiffres dans le cadre jaune, puis capturez avec la barre du bas.</p>
      </header>

      <section class="stage">
        <div class="viewport">
          <video id="camera" playsinline muted autoplay></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="roi" class="roi" title="Glisser pour déplacer · poignées pour redimensionner">
            <span class="handle nw" data-handle="nw"></span>
            <span class="handle ne" data-handle="ne"></span>
            <span class="handle sw" data-handle="sw"></span>
            <span class="handle se" data-handle="se"></span>
          </div>
        </div>

        <p id="status" class="status status-line">Caméra en attente…</p>
      </section>

      <aside class="collect-dock" aria-label="Collecte d’exemples">
        <div class="dock-pending">
          <img id="pending-preview" alt="Capture en attente" hidden />
        </div>
        <div class="dock-row">
          <button id="btn-start" type="button">Caméra</button>
          <button id="btn-capture" type="button" class="secondary" disabled>Capturer</button>
          <label class="label-field dock-label">
            Valeur
            <input
              id="label-input"
              type="text"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
            />
          </label>
          <button id="btn-save-sample" type="button" disabled>OK</button>
        </div>
        <div class="dock-row secondary-row">
          <button id="btn-export-dataset" type="button" class="ghost">Exporter .zip</button>
          <button id="btn-clear-dataset" type="button" class="ghost">Effacer</button>
          <button id="btn-toggle-more" type="button" class="ghost" aria-expanded="false" aria-controls="more-panel">
            Plus
          </button>
        </div>
      </aside>

      <section id="more-panel" class="more-panel" hidden>
        <details class="more-block">
          <summary>Essai lecture 7-segments</summary>
          <div class="preview-panel">
            <p class="label">Zone analysée</p>
            <canvas id="preview" width="240" height="80"></canvas>
            <p class="label">Poids lu</p>
            <div id="weight" class="weight">—</div>
            <p id="calib-state" class="calib-state" data-state="missing">Non calibré</p>
          </div>
          <div class="controls">
            <button id="btn-calibrate" type="button" class="secondary" disabled>Calibrer 0.00</button>
            <button id="btn-clear-calib" type="button" class="ghost" disabled>Effacer calib.</button>
            <button id="btn-read" type="button" disabled>Lire</button>
            <button id="btn-live" type="button" disabled>Live</button>
            <label class="toggle">
              Polarité
              <select id="invert">
                <option value="auto" selected>Auto</option>
                <option value="led">LED claire</option>
                <option value="lcd">LCD sombre</option>
              </select>
            </label>
          </div>
        </details>

        <div class="dataset-gallery">
          <h2>Exemples collectés</h2>
          <div id="sample-list" class="sample-list"></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
